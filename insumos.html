<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insumos · Florais ERP</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .calc-panel {
      background: var(--verde-escuro);
      color: var(--off-white);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 26px;
    }

    .calc-panel h2 {
      color: var(--off-white);
      font-size: 18px;
      margin: 0 0 4px;
    }

    .calc-panel p {
      font-size: 13px;
      color: var(--rosa-queimado);
      margin: 0 0 16px;
    }

    .calc-panel label {
      color: var(--rosa-queimado);
    }

    .calc-resultado {
      margin-top: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      display: none;
    }

    .calc-resultado.show {
      display: block;
    }

    .calc-resultado .linha {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
    }

    .calc-resultado .destaque {
      color: var(--amarelo);
      font-weight: 600;
    }

    .calc-usar {
      margin-top: 12px;
      width: 100%;
      background: var(--off-white);
    }

    .calc-usar:hover {
      background: var(--linha);
    }

    header.top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 20px 0;
    }

    header.top img {
      height: 30px;
    }

    .back {
      font-size: 13px;
      color: var(--cinza-texto);
      text-decoration: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin: 24px 0;
      flex-wrap: wrap;
    }

    .form-card {
      background: var(--rosa-queimado);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 26px;
      border: 1px solid var(--linha);
      display: none;
    }

    .form-card.open {
      display: block;
    }

    .form-card h2 {
      font-size: 18px;
      margin: 2px 0 16px;
    }

    .match-hint {
      background: var(--amarelo);
      border: 1px solid #E6C878;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
      color: #6b5218;
      display: none;
    }

    .match-hint.open {
      display: block;
    }

    .match-hint b {
      display: block;
      margin-bottom: 6px;
    }

    .match-hint .choices {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .match-hint button {
      font-size: 12.5px;
      padding: 7px 12px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .list-head h2 {
      font-size: 19px;
      margin: 0;
    }

    .count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #8a8378;
    }

    .insumo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 4px;
      border-bottom: 1px solid var(--linha);
    }

    .insumo:last-child {
      border-bottom: none;
    }

    .insumo-nome {
      font-weight: 600;
      font-size: 14.5px;
    }

    .insumo-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #8a8378;
      margin-top: 3px;
    }

    .insumo-preco {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14.5px;
      color: var(--verde-escuro);
      font-weight: 500;
      white-space: nowrap;
    }

    .insumo-row-actions {
      display: flex;
      gap: 4px;
      margin-left: 12px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8a8378;
      padding: 6px;
      font-size: 14px;
      border-radius: 6px;
    }

    .icon-btn:hover {
      background: rgba(0, 0, 0, 0.05);
      color: var(--carvao);
    }

    .tag-origem {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(90, 116, 87, 0.12);
      color: var(--verde-escuro);
      margin-left: 8px;
      letter-spacing: 0.02em;
    }
  </style>
</head>

<body>
  <header class="top">
    <a class="back" href="dashboard.html">← Início</a>
    <img src="assets/img/logo.png" alt="Entre Flores">
  </header>

  <div class="wrap">
    <div class="eyebrow" style="margin-top:16px;">Florais · ERP Floricultura</div>
    <h1>Insumos</h1>

    <div class="actions">
      <button class="btn-secondary" id="btnManual">Adicionar insumo</button>
      <button class="btn-secondary" id="btnCalc">Calculadora de apoio</button>
    </div>

    <div class="calc-panel" id="calcPanel" hidden>
      <h2>Calculadora de valor individual</h2>
      <p>Comprou em lote? Informe o total pago e a quantidade pra achar o preço por unidade.</p>
      <div class="row2">
        <div class="field">
          <label>Preço total pago (R$)</label>
          <input type="number" step="0.01" id="cTotal" placeholder="Ex: 45,00">
        </div>
        <div class="field">
          <label>Quantidade comprada</label>
          <input type="number" step="0.01" id="cQtd" placeholder="Ex: 12">
        </div>
      </div>
      <div class="calc-resultado" id="calcResultado">
        <div class="linha"><span>Preço por unidade</span><span class="destaque" id="calcUnitario">—</span></div>
      </div>
      <button class="btn-secondary calc-usar" id="btnUsarCalculo">Usar este valor no cadastro</button>
    </div>

    <div class="form-card" id="formCard">
      <h2 id="formTitle">Novo insumo</h2>

      <div class="match-hint" id="matchHint">
        <b>Já existe um insumo parecido: <span id="matchName"></span></b>
        <span id="matchDetail"></span>
        <div class="choices">
          <button class="btn-secondary" id="btnUpdateExisting">Atualizar preço deste</button>
          <button class="btn-ghost" id="btnCreateAnyway">Criar como novo mesmo assim</button>
        </div>
      </div>

      <div class="field">
        <label>Nome do insumo</label>
        <input type="text" id="fNome" placeholder="Ex: Rosa vermelha">
      </div>
      <div class="row2">
        <div class="field">
          <label>Unidade de medida</label>
          <select id="fUnidade">
            <option value="haste">haste</option>
            <option value="metro">metro</option>
            <option value="unidade">unidade</option>
            <option value="kg">kg</option>
            <option value="folha">folha</option>
          </select>
        </div>
        <div class="field">
          <label>Preço por unidade (R$)</label>
          <input type="number" step="0.01" id="fPreco" placeholder="0,00">
        </div>
        <div class="field">
          <label>Perda esperada (%)</label>
          <input type="number" step="1" id="fPerda" placeholder="10">
        </div>
      </div>
      <div class="field">
        <label>Fornecedor (opcional)</label>
        <input type="text" id="fFornecedor" placeholder="Ex: CEAGESP">
      </div>

      <div class="form-actions">
        <button class="btn-primary" id="btnSalvar">Salvar insumo</button>
        <button class="btn-ghost" id="btnCancelar">Cancelar</button>
      </div>
    </div>

    <div class="list-head">
      <h2>Cadastrados</h2>
      <span class="count" id="count">0</span>
    </div>
    <div id="lista"></div>
    <div class="empty" id="empty">Nenhum insumo ainda.</div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script>
    let insumos = [];
    let userId = null;
    let editingId = null;
    let pendingMatchId = null;
    let stream = null;

    const el = id => document.getElementById(id);
    const toast = (msg) => {
      const t = el('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    };

    function normalize(s) {
      return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }
    function similarity(a, b) {
      a = normalize(a); b = normalize(b);
      if (a === b) return 1;
      const m = a.length, n = b.length;
      if (!m || !n) return 0;
      const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
      for (let j = 0; j <= n; j++) d[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
        }
      }
      return 1 - d[m][n] / Math.max(m, n);
    }
    function findBestMatch(nome) {
      let best = null, bestScore = 0;
      for (const it of insumos) {
        const s = similarity(it.nome, nome);
        if (s > bestScore) { bestScore = s; best = it; }
      }
      return bestScore >= 0.72 ? best : null;
    }

    async function load() {
      const { data, error } = await supabaseClient
        .from('insumos')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) { toast('Não consegui carregar os insumos'); console.error(error); return; }
      insumos = data || [];
      render();
    }

    function render() {
      const list = el('lista');
      list.innerHTML = '';
      el('count').textContent = insumos.length;
      el('empty').style.display = insumos.length ? 'none' : 'block';
      insumos.forEach(it => {
        const row = document.createElement('div');
        row.className = 'insumo';
        row.innerHTML = `
      <div>
        <div class="insumo-nome">${it.nome}</div>
        <div class="insumo-meta">${it.unidade}${it.fornecedor ? ' · ' + it.fornecedor : ''}</div>
      </div>
      <div style="display:flex;align-items:center;">
        <div class="insumo-preco">R$ ${Number(it.preco).toFixed(2)}</div>
        <div class="insumo-row-actions">
          <button class="icon-btn" data-edit="${it.id}" title="Editar">✎</button>
          <button class="icon-btn" data-del="${it.id}" title="Excluir">🗑</button>
        </div>
      </div>
    `;
        list.appendChild(row);
      });
      list.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
      list.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeItem(b.dataset.del));
    }

    function openManual(prefill) {
      editingId = null;
      pendingMatchId = null;
      el('formTitle').textContent = 'Novo insumo';
      el('fNome').value = prefill?.nome || '';
      el('fUnidade').value = prefill?.unidade || 'haste';
      el('fPreco').value = prefill?.preco || '';
      el('fPerda').value = prefill?.perda || '';
      el('fFornecedor').value = prefill?.fornecedor || '';
      el('matchHint').classList.remove('open');
      el('formCard').classList.add('open');
      el('fNome').focus();
      checkMatchOnType();
    }
    function openEdit(id) {
      const it = insumos.find(i => i.id === id);
      if (!it) return;
      editingId = id;
      pendingMatchId = null;
      el('formTitle').textContent = 'Editar insumo';
      el('fNome').value = it.nome;
      el('fUnidade').value = it.unidade;
      el('fPreco').value = it.preco;
      el('fPerda').value = it.perda;
      el('fFornecedor').value = it.fornecedor || '';
      el('matchHint').classList.remove('open');
      el('formCard').classList.add('open');
      window.scrollTo({ top: el('formCard').offsetTop - 20, behavior: 'smooth' });
    }
    async function removeItem(id) {
      const { error } = await supabaseClient.from('insumos').delete().eq('id', id);
      if (error) { toast('Não consegui remover'); return; }
      insumos = insumos.filter(i => i.id !== id);
      render();
      toast('Insumo removido');
    }
    function closeForm() {
      el('formCard').classList.remove('open');
      el('matchHint').classList.remove('open');
      editingId = null; pendingMatchId = null;
    }

    function checkMatchOnType() {
      el('fNome').oninput = () => {
        if (editingId) return;
        const nome = el('fNome').value.trim();
        if (nome.length < 3) { el('matchHint').classList.remove('open'); return; }
        const match = findBestMatch(nome);
        if (match) {
          pendingMatchId = match.id;
          el('matchName').textContent = match.nome;
          el('matchDetail').textContent = `Preço atual: R$ ${Number(match.preco).toFixed(2)} (${match.unidade})`;
          el('matchHint').classList.add('open');
        } else {
          pendingMatchId = null;
          el('matchHint').classList.remove('open');
        }
      };
    }

    el('btnUpdateExisting').onclick = () => {
      if (!pendingMatchId) return;
      editingId = pendingMatchId;
      el('matchHint').classList.remove('open');
      toast('Vai atualizar o insumo existente ao salvar');
    };
    el('btnCreateAnyway').onclick = () => {
      pendingMatchId = null;
      el('matchHint').classList.remove('open');
    };

    el('btnSalvar').onclick = async () => {
      const _nome = el('fNome').value.trim();
      const _unidade = el('fUnidade').value;
      const _preco = parseFloat(el('fPreco').value);
      const _perda = parseInt(el('fPerda').value);
      const _fornecedor = el('fFornecedor').value.trim();
      if (!_nome || isNaN(_preco)) {
        toast('Preencha nome e preço');
        return;
      }
      if (editingId) {
        const { error } = await supabaseClient
          .from('insumos')
          .update({ nome: _nome, unidade: _unidade, preco: _preco, perda: _perda, fornecedor: _fornecedor })
          .eq('id', editingId);
        if (error) { toast('Não consegui salvar'); console.error(error); return; }
      } else {
        const { error } = await supabaseClient
          .from('insumos')
          .insert({ nome: _nome, unidade: _unidade, preco: _preco, perda: _perda, fornecedor: _fornecedor, origem: window.__lastOrigem || 'manual', user_id: userId });
        if (error) { toast('Não consegui salvar'); console.error(error); return; }
      }
      window.__lastOrigem = 'manual';
      await load();
      closeForm();
      toast('Insumo salvo');
    };
    el('btnCancelar').onclick = closeForm;
    el('btnManual').onclick = () => openManual();

    el('btnCalc').onclick = () => {
      const resultado = el('calcPanel');
      resultado.hidden = !resultado.hidden;
    };

    /* ---- calculadora de valor individual ---- */
    function atualizarCalculo() {
      const total = parseFloat(el('cTotal').value);
      const qtd = parseFloat(el('cQtd').value);
      const resultado = el('calcResultado');
      if (!isNaN(total) && !isNaN(qtd) && qtd > 0) {
        const unitario = total / qtd;
        el('calcUnitario').textContent = 'R$ ' + unitario.toFixed(2);
        resultado.classList.add('show');
      } else {
        resultado.classList.remove('show');
      }
    }
    el('cTotal').oninput = atualizarCalculo;
    el('cQtd').oninput = atualizarCalculo;

    el('btnUsarCalculo').onclick = () => {
      const total = parseFloat(el('cTotal').value);
      const qtd = parseFloat(el('cQtd').value);
      if (isNaN(total) || isNaN(qtd) || qtd <= 0) {
        toast('Preencha o total pago e a quantidade primeiro');
        return;
      }
      const unitario = (total / qtd).toFixed(2);
      if (!el('formCard').classList.contains('open')) {
        openManual({ preco: unitario });
      } else {
        el('fPreco').value = unitario;
      }
      toast('Valor aplicado ao cadastro');
    };

    /* ---- calculadora de valor individual ---- */
    function atualizarCalculo() {
      const total = parseFloat(el('cTotal').value);
      const qtd = parseFloat(el('cQtd').value);
      const resultado = el('calcResultado');
      if (!isNaN(total) && !isNaN(qtd) && qtd > 0) {
        const unitario = total / qtd;
        el('calcUnitario').textContent = 'R$ ' + unitario.toFixed(2);
        resultado.classList.add('show');
      } else {
        resultado.classList.remove('show');
      }
    }
    el('cTotal').oninput = atualizarCalculo;
    el('cQtd').oninput = atualizarCalculo;

    el('btnUsarCalculo').onclick = () => {
      const total = parseFloat(el('cTotal').value);
      const qtd = parseFloat(el('cQtd').value);
      if (isNaN(total) || isNaN(qtd) || qtd <= 0) {
        toast('Preencha o total pago e a quantidade primeiro');
        return;
      }
      const unitario = (total / qtd).toFixed(2);
      if (!el('formCard').classList.contains('open')) {
        openManual({ preco: unitario });
      } else {
        el('fPreco').value = unitario;
      }
      toast('Valor aplicado ao cadastro');
    };

    (async () => {
      const session = await requireAuth();
      if (!session) return;
      userId = session.user.id;
      load();
    })();
  </script>
</body>

</html>
